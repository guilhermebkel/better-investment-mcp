name: CI

on:
  push:
    branches: [main]
  pull_request:

# Why: the jobs run in parallel and together run everything `pnpm check` runs, plus the packed tarball and the Docker image; CI never uses lint-staged.
jobs:
  typecheck-lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - uses: actions/cache@v4
        with:
          path: tsconfig.tsbuildinfo
          key: tsbuildinfo-${{ hashFiles('pnpm-lock.yaml', 'tsconfig.json') }}
      - run: pnpm typecheck
      # Why: ESLint's content cache is keyed by the config, so a rule or config change re-lints every file even on a hit; Oxlint keeps no cache.
      - uses: actions/cache@v4
        with:
          path: .eslintcache
          key: eslint-${{ hashFiles('pnpm-lock.yaml', 'eslint.config.mjs', '.oxlintrc.json', 'scripts/eslint-local-rules.mjs', 'tsconfig.json') }}
      - run: pnpm lint

  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm quality
      - run: pnpm source:drift
      - run: pnpm check:tool-docs

  unit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm check:pack
      - run: pnpm check:licenses
      - run: pnpm smoke

  # Why: this is the way a user runs it: the packed tarball through npx, on each system a user may run it on.
  tarball-smoke:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Run the packed tarball through npx
        shell: bash
        run: |
          TARBALL=$(npm pack --silent)
          # Why: the HTTP smoke runs in the Docker job and the package job; this job checks the npx path over stdio, where a cold install takes the longest.
          node scripts/package-smoke.mjs --stdio-only -- npx --yes --package "./$TARBALL" better-investment-mcp

  docker-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: docker build --tag better-investment-mcp:ci .
      # Why: `-i` is what a stdio client passes; without it the server gets no input and exits.
      - run: node scripts/package-smoke.mjs --stdio-only -- docker run -i --rm better-investment-mcp:ci
      # Why: the token is passed by name (`-e INVESTMENT_MCP_HTTP_TOKEN`), so the value stays in this step's environment and never in the command line.
      - name: Docker HTTP smoke
        env:
          INVESTMENT_MCP_HTTP_TOKEN: smoke-http-token-12345678
        run: |
          node scripts/package-smoke.mjs --http-only -- \
            docker run --rm -p 3100:3100 \
            -e INVESTMENT_MCP_TRANSPORT=http \
            -e INVESTMENT_MCP_HTTP_HOST=0.0.0.0 \
            -e INVESTMENT_MCP_HTTP_TOKEN \
            better-investment-mcp:ci
      # Why: AC3 of the packaging issue: the image runs as a user other than root.
      - name: The image does not run as root
        run: test "$(docker run --rm --entrypoint id better-investment-mcp:ci -u)" != "0"

  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      # Why: no integration test exists yet; the command passes while there are none, and the job is the place the first one runs.
      - run: pnpm test:integration
