name: Release

# Why: a version tag starts the release; `workflow_dispatch` with dry_run runs every step up to publishing, so the pipeline can be tested without a tag.
on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Skip publishing and the GitHub release"
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - name: The tag matches package.json
        if: github.event_name == 'push'
        run: test "${GITHUB_REF_NAME#v}" = "$(node -p "require('./package.json').version")"

  publish-npm:
    needs: check
    runs-on: ubuntu-latest
    # Why: trusted publishing signs the package with provenance and needs no npm token.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org
      - run: npm install --global npm@^11.5.1
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: Publish (dry run unless a tag)
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || 'false' }}
        run: |
          if [ "$DRY_RUN" = "true" ]; then
            npm publish --dry-run --access public
          else
            npm publish --provenance --access public
          fi

  publish-image:
    needs: check
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.event_name == 'push' || !inputs.dry_run
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build the image and push it
        uses: docker/build-push-action@v6
        with:
          context: .
          push: ${{ github.event_name == 'push' || !inputs.dry_run }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/better-investment-analysis-mcp:${{ github.ref_name }}
            ghcr.io/${{ github.repository_owner }}/better-investment-analysis-mcp:latest

  github-release:
    needs: [publish-npm, publish-image]
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from the changelog
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          awk -v heading="## [$VERSION]" 'index($0, heading) == 1 { found = 1; next } /^## / { found = 0 } found' CHANGELOG.md > notes.md
          test -s notes.md
          gh release create "$GITHUB_REF_NAME" --title "$GITHUB_REF_NAME" --notes-file notes.md
